name: Publish verified MXB Local release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-local-release.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-mxb-local-0.20.6-local.3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Crab-Krab/mxb-local' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Crab-Krab/mxb-local
      BUILD_RUN: '40850647284'
      BUILD_SHA: 8a59578a47841be2c7d51ee889417f310c9b50ab
      ARTIFACT_ID: '12887474877'
      ARCHIVE_SHA256: 391d1c9dfa78a89d464a207cf8e73c61ad67fc948ba04fc8218c92e71f955102
      INSTALLER_SHA256: 956cd87a909388b749bd842de8b53e4117fffd74c0dba40559d91426b29909a4
      INSTALLER: MXB Local_0.20.6-local.3_x64-setup.exe
      RELEASE_TAG: v0.20.6-local.3
      DEPENDENCY_ARTIFACT_ID: '12885844609'
      DEPENDENCY_ARCHIVE_SHA256: 6768ae576895f749d9941e6b2e1d217e40d766f93e50c8a94a5ef87af847cb05
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the successful source build and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts" > artifacts.json
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > existing-tags.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('build-run.json').read_text())
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['head_sha'] == os.environ['BUILD_SHA']
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/build-local-windows.yml'
          artifact = next(a for a in json.loads(Path('artifacts.json').read_text())['artifacts']
                          if a['id'] == int(os.environ['ARTIFACT_ID']))
          assert artifact['name'] == 'MXB-Local-Windows' and not artifact['expired']
          assert artifact['digest'] == 'sha256:' + os.environ['ARCHIVE_SHA256']
          dependency = next(a for a in json.loads(Path('artifacts.json').read_text())['artifacts'] if a['id'] == int(os.environ['DEPENDENCY_ARTIFACT_ID']))
          assert dependency['name'] == 'dependency-review' and not dependency['expired']
          assert dependency['digest'] == 'sha256:' + os.environ['DEPENDENCY_ARCHIVE_SHA256']
          for tag in json.loads(Path('existing-tags.json').read_text()):
              if tag['ref'] == 'refs/tags/' + os.environ['RELEASE_TAG']:
                  assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['BUILD_SHA']
          print('Verified successful build, source commit and artifact digest.')
          PY

      - name: Download and verify the original installer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output verified-build.zip \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output verified-dependencies.zip \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/$DEPENDENCY_ARTIFACT_ID/zip"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          archive = Path('verified-build.zip').read_bytes()
          assert hashlib.sha256(archive).hexdigest() == os.environ['ARCHIVE_SHA256']
          output = Path('release-assets')
          output.mkdir()
          with zipfile.ZipFile('verified-build.zip') as z:
              installer = z.read(os.environ['INSTALLER'])
              digest = hashlib.sha256(installer).hexdigest()
              assert digest == os.environ['INSTALLER_SHA256']
              assert digest.upper() in z.read('SHA256.txt').decode('utf-8-sig').upper()
              (output / os.environ['INSTALLER']).write_bytes(installer)
              (output / 'LICENSE').write_bytes(z.read('LICENSE'))
              for name in ['Cargo.lock', 'bun.lock', 'frontend-runtime-modules.json']:
                  (output / name).write_bytes(z.read(name))
              (output / 'SHA256SUMS.txt').write_text(digest + '  ' + os.environ['INSTALLER'].replace(' ', '.') + '\n')
          dependency_archive = Path('verified-dependencies.zip').read_bytes()
          assert hashlib.sha256(dependency_archive).hexdigest() == os.environ['DEPENDENCY_ARCHIVE_SHA256']
          with zipfile.ZipFile('verified-dependencies.zip') as z:
              (output / 'windows-runtime-tree.txt').write_bytes(z.read('windows-runtime-tree.txt'))
              findings = json.loads(z.read('dependency-advisories.json'))
              for advisory in findings['advisories']:
                  advisory.pop('details', None)
              (output / 'dependency-advisories.json').write_text(json.dumps(findings, indent=2))
          (output / 'SECURITY-REVIEW.md').write_bytes(Path('SECURITY-REVIEW-local.3.md').read_bytes())
          print('Archive and installer SHA256 verified. Installer is unchanged from the tested build.')
          PY

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## MXB Local for Windows

          An independent personal fork of [Frostn1/mxb-app](https://github.com/Frostn1/mxb-app), based on v0.20.6. The upstream MIT license and attribution are retained.

          ### Install or update

          Download **MXB.Local_0.20.6-local.3_x64-setup.exe** below, close MXB Local, then run the installer. Existing MXB Local settings are retained. GitHub's automatic Source code downloads contain the source, not the Windows installer.

          This is the same installer produced by the [successful Windows build and regression checks](https://github.com/Crab-Krab/mxb-local/actions/runs/40850647284), from commit `8a59578a47841be2c7d51ee889417f310c9b50ab`.

          ### Included

          - Sanitized remote descriptions and a Content Security Policy.
          - Patched TLS dependencies and Windows DPAPI protection for saved credentials.
          - Automatic usage/game-memory reporting disabled; upstream app updates and native game-DLL installation blocked.
          - Permanent first-run setup completion fix.
          - MXB popularity browsing using the site's current public ranking, with clearer category-limit messages.
          - MXB Local branding with an upstream source credit.
          - Built-in voice chat excluded, including microphone access, voice commands, audio codecs and WebRTC dependencies.
          - Setup component browser tests and archive path/link safety regressions.

          The attached **SECURITY-REVIEW.md** explains the current advisory findings and which APIs/platforms they concern. Machine-readable dependency findings with source references, the Windows dependency graph, production frontend inventory and exact lockfiles are attached for review. A completed scan is not a zero-vulnerability certification.

          Track download/install, gameplay, uninstall and installer replacement were manually verified with local.2. The new local.3 build has the automated checks linked above; its setup browser tests simulate native APIs.

          ### Limits

          - Unsigned personal build, not an official Frost/mxbsecure release. Automated checks and local smoke tests do not guarantee the absence of vulnerabilities.
          - Popularity covers the site's top 100 overall, narrowed to the selected category. Newest and Oldest browse the full category; a category can have no entries in the top 100.
          - Private upstream integrations and some store/geometry/server features are unavailable. Optional online features still depend on their services.
          - Updates are installed manually from this fork.

          **Installer SHA256:** `956cd87a909388b749bd842de8b53e4117fffd74c0dba40559d91426b29909a4`
          NOTES

      - name: Stage and verify release assets, then publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          sha = os.environ['BUILD_SHA']
          def api(path, payload=None, method=None):
              args = ['gh', 'api', path]
              if method:
                  args += ['--method', method]
              if payload is not None:
                  args += ['--input', '-']
              raw = subprocess.run(args, input=json.dumps(payload) if payload is not None else None,
                                   capture_output=True, text=True, check=True).stdout
              return json.loads(raw) if raw.strip() else None
          def matching_release():
              rows = [r for r in api(f'repos/{repo}/releases?per_page=100') if r['tag_name'] == tag]
              assert len(rows) <= 1
              return rows[0] if rows else None
          release = matching_release()
          if release is None:
              subprocess.run(['gh', 'release', 'create', tag, '--repo', repo, '--target', sha,
                              '--title', 'MXB Local 0.20.6-local.3', '--draft', '--prerelease',
                              '--notes-file', 'release-notes.md',
                              *[str(p) for p in sorted(Path('release-assets').iterdir())]], check=True)
              release = matching_release()
          assert release is not None and release['target_commitish'] == sha
          assert release['tag_name'] == tag
          release_id = release['id']
          asset_name = 'MXB.Local_0.20.6-local.3_x64-setup.exe'
          checksum = (os.environ['INSTALLER_SHA256'] + '  ' + asset_name + '\n').encode()
          (Path('release-assets') / 'SHA256SUMS.txt').write_bytes(checksum)
          expected = {p.name.replace(' ', '.'): p.read_bytes() for p in Path('release-assets').iterdir()}
          release = api(f'repos/{repo}/releases/{release_id}')
          assets = {a['name']: a for a in release['assets']}
          assert set(assets) == set(expected)
          for name, data in expected.items():
              assert assets[name]['state'] == 'uploaded'
              assert assets[name]['size'] == len(data)
              assert assets[name]['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest(), name
          print('All staged asset sizes and SHA256 digests match the verified original files.')
          if release['draft'] or release['prerelease']:
              release = api(f'repos/{repo}/releases/{release_id}', {
                  'draft': False, 'tag_name': tag, 'target_commitish': sha,
                  'body': Path('release-notes.md').read_text(), 'prerelease': False, 'make_latest': 'true'}, method='PATCH')
          assert not release['draft'] and not release['prerelease'] and release['published_at']
          published_tag = api(f'repos/{repo}/git/ref/tags/{tag}')
          assert published_tag['object']['type'] == 'commit' and published_tag['object']['sha'] == sha
          print('Published release verified:', release['html_url'])
          PY
