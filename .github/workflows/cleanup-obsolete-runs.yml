name: Clean up obsolete MXB Local runs

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-obsolete-runs.yml]

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-three-obsolete-mxb-local-runs
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'Crab-Krab/mxb-local' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Crab-Krab/mxb-local
    steps:
      - name: Verify retained records and release, then delete only the three obsolete runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ['GH_REPO']
          assert repo == 'Crab-Krab/mxb-local'
          base = f'repos/{repo}'
          def api(path, method='GET'):
              result = subprocess.run(['gh', 'api', path, '--method', method],
                                      capture_output=True, text=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          retained = {
              40813594922: ('Build MXB Local for Windows', '24fb7f6387639704068e5ea87d0c4eb228125dea'),
              40840806715: ('Publish verified MXB Local release', '73b6cad62954f5df46d70bd478c18c66970542d8'),
          }
          targets = {
              40840448786: ('Publish verified MXB Local release', '3927f4ea8968b952b2a6ac3fe7068a9685518b6c', 'failure'),
              40812131502: ('Build MXB Local for Windows', '5213d63fa20619858a6dc3323bd80fd48d1903fe', 'success'),
              40806541996: ('Build MXB Local for Windows', '17ef4146627f6653585c70af12fc6bf82f97b90e', 'success'),
          }
          assert not set(retained).intersection(targets)
          assert int(os.environ['GITHUB_RUN_ID']) not in targets
          for run_id, (name, sha) in retained.items():
              run = api(f'{base}/actions/runs/{run_id}')
              assert run['id'] == run_id and run['repository']['full_name'] == repo
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert run['name'] == name and run['head_sha'] == sha
          release = api(f'{base}/releases/tags/v0.20.6-local.2')
          assert release['id'] == 427601104 and not release['draft'] and release['published_at']
          expected_assets = {a['name']: (a['id'], a['digest']) for a in release['assets']}
          assert expected_assets['MXB.Local_0.20.6-local.2_x64-setup.exe'][1] == 'sha256:3e9b648278f463c30934533fdf9cc51ac8499a1695f4ccc37db8bd3e84f3d741'
          # Validate every target before the first deletion. No age-based or
          # broad matching rules are used; future runs cannot enter this list.
          checked = []
          for run_id, (name, sha, conclusion) in targets.items():
              run = api(f'{base}/actions/runs/{run_id}')
              assert run['id'] == run_id and run['repository']['full_name'] == repo
              assert run['head_repository']['full_name'] == repo
              assert run['status'] == 'completed' and run['conclusion'] == conclusion
              assert run['name'] == name and run['head_sha'] == sha
              checked.append((run_id, run['display_title']))
          for run_id, title in checked:
              api(f'{base}/actions/runs/{run_id}', 'DELETE')
              print(f'Deleted obsolete run {run_id}: {title}')
          remaining = api(f'{base}/actions/runs?per_page=100')['workflow_runs']
          ids = {r['id'] for r in remaining}
          assert not ids.intersection(targets)
          assert set(retained).issubset(ids)
          after = api(f'{base}/releases/tags/v0.20.6-local.2')
          assert after['id'] == release['id'] and not after['draft']
          assert {a['name']: (a['id'], a['digest']) for a in after['assets']} == expected_assets
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('Deleted the failed publishing run and two older build runs.\n\n')
              summary.write('Retained the successful local.2 build, successful release-publishing run, and all published release assets.\n')
          print('Cleanup verified: retained records and release assets are intact.')
          PY

