name: Build MXB Local for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record Windows runtime dependency graph
        run: |
          mkdir -p .security-results
          cargo tree --locked -p mxb-app --target x86_64-pc-windows-msvc --edges normal --prefix none --format '{p}' > .security-results/windows-runtime-tree.txt
          if grep -E '^(str0m|str0m-rust-crypto|cpal|opus|opusic-sys) v' .security-results/windows-runtime-tree.txt; then
            echo 'Voice dependencies must not be present in MXB Local'
            exit 1
          fi
      - name: Collect current lockfile advisories for release review
        run: python3 scripts/audit-dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-review
          include-hidden-files: true
          path: .security-results/
          retention-days: 30
          if-no-files-found: error
  frontend-checks:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      VITE_APP_NAME: MXB Local
      MXB_DEPENDENCY_REVIEW: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Check frontend before the native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          bun test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend unit tests failed' }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Frontend type check failed' }
          bun run lint
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed' }
          bun run --cwd apps/manager build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Run description rendering regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --prefix .security-browser --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Test browser dependency installation failed' }
          $env:NODE_PATH = "$PWD\.security-browser\node_modules"
          & .\.security-browser\node_modules\.bin\playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Test browser installation failed' }
          node apps/manager/test/run-description-security.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Description security regressions failed' }
          node apps/manager/test/run-setup-flow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'First-run setup browser regressions failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dependency-review
          path: .security-results/frontend-runtime-modules.json
          retention-days: 30
          if-no-files-found: error
  build:
    needs: frontend-checks
    runs-on: windows-2022
    timeout-minutes: 90
    # Only this job signs anything: the attestation below proves the installer came from this
    # workflow run and commit. `id-token` lets it get a short-lived signing certificate.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      VITE_APP_NAME: MXB Local
      MXB_DEPENDENCY_REVIEW: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Rust, Bun, Python and MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC build tools not found on Windows runner' }
          cmd /s /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $key = $matches[1]; $value = $matches[2]
              if ($key -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($key) -ne $value) {
                Add-Content $env:GITHUB_ENV "$key=$value"
              }
            }
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned setup-python commit
        with:
          python-version: '3.12'
      - name: Reuse Rust dependencies and compiled objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-mxb-local-rust-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-mxb-local-rust-${{ hashFiles('Cargo.lock') }}-
            windows-mxb-local-rust-
      - name: Build and run all Windows tests
        shell: pwsh
        run: ./scripts/build-local.ps1
      - name: Check the app needs no Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Tauri renames the built binary to `mainBinaryName` from tauri.conf.json.
          $config = Get-Content apps/manager/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $exe = Join-Path target/release ("{0}.exe" -f $config.mainBinaryName)
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing expected executable: $exe" }
          $imports = dumpbin /nologo /dependents $exe
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $imports | Write-Host
          # Only the Visual C++ redistributable's own DLLs. The api-ms-win-crt-* imports are the
          # Universal C Runtime, which ships with Windows 10 and later, so nothing installs them.
          $bad = $imports | Select-String -Pattern 'MSVCP\d+|VCRUNTIME\d+|CONCRT\d+' -CaseSensitive:$false
          if ($bad) { throw "The executable still imports Visual C++ redistributable DLLs: $($bad -join ', ')" }
      - name: Package installer, sources and resolved lockfiles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery | Out-Null
          $config = Get-Content apps/manager/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $installer = Join-Path target/release/bundle/nsis ("{0}_{1}_x64-setup.exe" -f $config.productName, $config.version)
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing expected installer: $installer" }
          Copy-Item -LiteralPath $installer -Destination delivery/
          Copy-Item Cargo.lock,bun.lock,LOCAL-FORK.md,LICENSE delivery/
          Copy-Item .security-results/frontend-runtime-modules.json delivery/
          Get-ChildItem delivery/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File delivery/SHA256.txt
          # Also in the log and the run summary, so the hash the publish workflow asks for can be
          # read without downloading the artifact.
          Get-Content delivery/SHA256.txt | Write-Host
          Get-ChildItem delivery/*.exe | ForEach-Object {
            "Installer ``$($_.Name)`` SHA-256: ``$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())``" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Attest that the installer was built by this workflow
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: delivery/*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MXB-Local-Windows
          path: delivery/
          retention-days: 30
          if-no-files-found: error
