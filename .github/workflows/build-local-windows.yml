name: Build MXB Local for Windows

on:
  workflow_dispatch:
  push:
    branches: [local-security-fork]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record Windows runtime dependency graph
        run: |
          mkdir -p .security-results
          cargo tree --locked -p mxb-app --target x86_64-pc-windows-msvc --edges normal --prefix none --format '{p}' > .security-results/windows-runtime-tree.txt
          if grep -E '^(str0m|str0m-rust-crypto|cpal|opus|opusic-sys) v' .security-results/windows-runtime-tree.txt; then
            echo 'Voice dependencies must not be present in MXB Local'
            exit 1
          fi
      - name: Collect current lockfile advisories for release review
        run: python3 scripts/audit-dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-review
          include-hidden-files: true
          path: .security-results/
          retention-days: 30
          if-no-files-found: error
  frontend-checks:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      VITE_APP_NAME: MXB Local
      MXB_DEPENDENCY_REVIEW: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check frontend before the native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global bun@1.3.12
          if ($LASTEXITCODE -ne 0) { throw 'Bun installation failed' }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          bun test apps/manager/test/finishSetup.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Setup regressions failed' }
          bun run --cwd apps/manager build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Run description rendering regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --prefix .security-browser --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Test browser dependency installation failed' }
          $env:NODE_PATH = "$PWD\.security-browser\node_modules"
          & .\.security-browser\node_modules\.bin\playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Test browser installation failed' }
          node apps/manager/test/run-description-security.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Description security regressions failed' }
          node apps/manager/test/run-setup-flow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'First-run setup browser regressions failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dependency-review
          path: .security-results/frontend-runtime-modules.json
          retention-days: 30
          if-no-files-found: error
  build:
    needs: frontend-checks
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      VITE_APP_NAME: MXB Local
      MXB_DEPENDENCY_REVIEW: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Rust, Bun, Python and MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          npm install --global bun@1.3.12
          if ($LASTEXITCODE -ne 0) { throw 'Bun installation failed' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC build tools not found on Windows runner' }
          cmd /s /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $key = $matches[1]; $value = $matches[2]
              if ($key -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($key) -ne $value) {
                Add-Content $env:GITHUB_ENV "$key=$value"
              }
            }
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned setup-python commit
        with:
          python-version: '3.12'
      - name: Reuse Rust dependencies and compiled objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-mxb-local-rust-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-mxb-local-rust-${{ hashFiles('Cargo.lock') }}-
            windows-mxb-local-rust-
      - name: Build and run Windows security tests
        shell: pwsh
        run: ./scripts/build-local.ps1
      - name: Package installer, sources and resolved lockfiles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe delivery/
          Copy-Item Cargo.lock,bun.lock,LOCAL-FORK.md,LICENSE delivery/
          Copy-Item .security-results/frontend-runtime-modules.json delivery/
          Get-ChildItem delivery/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File delivery/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MXB-Local-Windows
          path: delivery/
          retention-days: 30
          if-no-files-found: error
